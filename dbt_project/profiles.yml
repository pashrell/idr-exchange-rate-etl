kurs:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('WAREHOUSE_HOST', 'postgres') }}"
      user: "{{ env_var('POSTGRES_USER', 'admin') }}"
      password: "{{ env_var('POSTGRES_PASSWORD', 'admin') }}"
      port: 5432
      dbname: "{{ env_var('POSTGRES_DB', 'warehouse') }}"
      schema: analytics
      threads: 2
