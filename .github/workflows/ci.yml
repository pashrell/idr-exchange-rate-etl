name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt (versi di-pin)
        run: pip install "dbt-core==1.8.9" "dbt-postgres==1.8.2"
      - name: Python syntax check (DAGs)
        run: python -m compileall dags
      - name: dbt deps + parse
        working-directory: dbt_project
        run: |
          dbt deps --profiles-dir .
          dbt parse --profiles-dir .
